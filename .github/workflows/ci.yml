# Полноценный CI/CD workflow на базе официальных шаблонов GitHub Actions:
# - ci/maven.yml          → сборка Java-проекта через Maven
# - ci/docker-publish.yml → сборка (и публикация) Docker-образа
#
# Документация:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
# https://docs.github.com/en/actions/publishing-packages/publishing-docker-images

name: CI

on:
  push:
    branches: [ master, develop, docker3 ]
  pull_request:
    branches: [ master, develop, docker3 ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: сборка и проверка проекта (шаблон Java CI with Maven)
  # Версия образа/артефакта всегда берётся из <version> в pom.xml
  # ---------------------------------------------------------------------------
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pom-version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Read project version from pom.xml
        id: pom-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version from pom.xml: $VERSION"

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ steps.pom-version.outputs.VERSION }}
          path: target/CurrencyConverter-*.jar
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Docker-образ (шаблон Docker / docker-publish)
  # Тег образа = project.version из pom.xml
  # На PR — только сборка; на push в master/develop — push в GitHub Container Registry
  # ---------------------------------------------------------------------------
  docker:
    name: Build Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
