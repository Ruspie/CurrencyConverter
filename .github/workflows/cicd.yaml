
name: CI

on:
  push:
    branches: [ master, developer ]
  pull_request:
    branches: [ master, developer ]

env:
  JAVA_VERSION: "17"
  IMAGE_NAME: ruspie/ruspie-rep

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pom-version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5

        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Read project version from pom.xml
        id: pom-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version from pom.xml: $VERSION"

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: app-jar-${{ steps.pom-version.outputs.VERSION }}
          path: target/CurrencyConverter-*.jar
        if-no-files-found: error
        retention-days: 3

  docker:
    name: Bild Docker Image
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set uo Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max