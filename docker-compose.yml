services:
  db:
    image: postgres:16-alpine
    container_name: currency-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume — данные Postgres переживают перезапуски и recreate контейнера
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Оба тега на один образ: версия + latest
      tags:
        - ${IMAGE_NAME}:${IMAGE_VERSION}
        - ${IMAGE_NAME}:latest
    image: ${IMAGE_NAME}:${IMAGE_VERSION}
    container_name: currency-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${APP_PORT}:8080"
    volumes:
      # Bind mount — файл с хоста виден в контейнере (режим loading.mode=file)
      - ./currency_rates.txt:/app/currency_rates.txt:ro
      # Bind mount — логи приложения остаются на хосте
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  # Named volume объявляется здесь; Docker сам создаёт и хранит его
  postgres_data:
