<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют (REST API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-5">
    <!-- Заголовок + статус авторизации -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Конвертер валют</h1>
        <div>
            <span id="auth-status" class="me-3">Не авторизован</span>
            <button id="login-btn" class="btn btn-outline-primary btn-sm">Войти</button>
            <button id="logout-btn" class="btn btn-outline-danger btn-sm d-none">Выйти</button>
        </div>
    </div>

    <!-- Основной блок конвертера -->
    <div class="card mb-5">
        <div class="card-body p-4">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="amount" class="form-label">Сумма:</label>
                    <input type="number" class="form-control" id="amount" value="1" min="0.01" step="0.01">
                </div>
                <div class="col-md-6">
                    <label for="rate-date" class="form-label">Дата курса:</label>
                    <select class="form-select" id="rate-date"></select>
                </div>
            </div>

            <div class="row align-items-end mb-3">
                <div class="col-md-5">
                    <label for="from-currency" class="form-label">Из:</label>
                    <select class="form-select" id="from-currency"></select>
                </div>
                <div class="col-md-2 text-center">
                    <button id="swap-btn" class="btn btn-outline-primary">⇄</button>
                </div>
                <div class="col-md-5">
                    <label for="to-currency" class="form-label">В:</label>
                    <select class="form-select" id="to-currency"></select>
                </div>
            </div>

            <button id="convert-btn" class="btn btn-success w-100 mb-3">Конвертировать</button>
            <div id="result" class="alert alert-info text-center" role="alert">Введите сумму для расчета</div>
        </div>
    </div>

    <!-- Блок популярных курсов -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Популярные курсы валют</h2>
        </div>
        <div class="card-body">
            <p id="rates-count" class="text-muted small"></p>
            <div id="rates-container" class="row"></div>
        </div>
    </div>
</div>

<!-- Модальное окно логина -->
<div id="login-modal" class="modal" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Вход в систему</h5>
                <button type="button" class="btn-close"
                        onclick="document.getElementById('login-modal').classList.add('d-none')"></button>
            </div>
            <div class="modal-body">
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div id="login-error" class="text-danger mb-3"></div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
