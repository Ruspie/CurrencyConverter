loading:
  enable: true
  mode: http
  filePath: ./currency_rates.txt
  timeout: 10s
  history:
    days: 10

scheduler:
  cron: "0 15 19 * * *"

spring:
  config:
    import: classpath:application-access.yaml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: cur_ex
        format_sql: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: cur_ex
    create-schemas: true
logging:
  config: classpath:log4j2.properties

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
