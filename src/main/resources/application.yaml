loading:
  enable: true
  mode: http
  filePath: ./currency_rates.txt

scheduler:
  executionTime: "21:39"

spring:
  config:
    import: classpath:application-access.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: cur_ex
        format_sql: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: cur_ex
    create-schemas: true
