
name = CurrencyConverter
status = WARN

property.logPath = ./logs
property.logPattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %cyan{%d{yyyy-MM-dd HH:mm:ss.SSS}} [%t] %highlight{%-5level}{FATAL=red, ERROR=red, WARN=yellow, INFO=white, DEBUG=blue, TRACE=cyan} %-40.40logger{1.} - %msg%n

appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = ${logPath}/app.log
appender.file.filePattern = ${logPath}/app-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${logPattern}
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10 MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 30

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

logger.example.name = org.example
logger.example.level = DEBUG
logger.example.additivity = false
logger.example.appenderRef.console.ref = Console
logger.example.appenderRef.file.ref = File






